# Whitepapers / guides that are published as PDF. HTML-hosted whitepapers live in docs-whitepapers.yaml.
# The PDFs below mirror HTML guides too, which lets us cross-check PDF conversion against the .md fetch.
whitepapers:
  - id: aip-c01-exam-guide
    title: "AWS Certified Generative AI Developer - Professional (AIP-C01) Exam Guide"
    url: https://docs.aws.amazon.com/pdfs/aws-certification/latest/ai-professional-01/ai-professional-01.pdf
    exam_domains: [1, 2, 3, 4, 5]
  - id: genai-lens
    title: "AWS Well-Architected Framework: Generative AI Lens"
    url: https://docs.aws.amazon.com/pdfs/wellarchitected/latest/generative-ai-lens/generative-ai-lens.pdf
    exam_domains: [1, 3, 4, 5]
    services: [well-architected]
  - id: caf-for-ai
    title: "AWS Cloud Adoption Framework for Artificial Intelligence, Machine Learning, and Generative AI"
    url: https://docs.aws.amazon.com/pdfs/whitepapers/latest/aws-caf-for-ai/aws-caf-for-ai.pdf
    exam_domains: [1, 3, 4]
  - id: rag-options
    title: "Retrieval Augmented Generation options and architectures on AWS"
    url: https://docs.aws.amazon.com/pdfs/prescriptive-guidance/latest/retrieval-augmented-generation-options/retrieval-augmented-generation-options.pdf
    exam_domains: [1]
    services: [rag]
