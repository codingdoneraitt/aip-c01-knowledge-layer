[project]
name = "aipc01-fetch-talks"
version = "0.1.0"
description = "Fetch transcripts of official AWS event talks"
requires-python = ">=3.12"
dependencies = ["aipc01-core"]
[project.scripts]
aipc01-fetch-talks = "aipc01_fetch_talks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_talks"]
