[project]
name = "aipc01-core"
version = "0.1.0"
description = "Shared building blocks for the AIP-C01 fetchers"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pyyaml>=6", "beautifulsoup4>=4.12", "lxml>=5", "markdownify>=0.13"]


[project.scripts]
aipc01-verify = "aipc01_core.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_core"]
