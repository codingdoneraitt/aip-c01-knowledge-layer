[project]
name = "aipc01-fetch-whitepapers"
version = "0.1.0"
description = "Fetch AWS whitepaper PDFs and convert to markdown"
requires-python = ">=3.12"
dependencies = ["aipc01-core", "markitdown[pdf]>=0.1"]
[project.scripts]
aipc01-fetch-whitepapers = "aipc01_fetch_whitepapers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_whitepapers"]
