[project]
name = "aipc01-fetch-guides"
version = "0.1.0"
description = "Fetch AWS decision guides and Solutions Library pages"
requires-python = ">=3.12"
dependencies = ["aipc01-core", "aipc01-fetch-docs"]
[project.scripts]
aipc01-fetch-guides = "aipc01_fetch_guides.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_guides"]
