[project]
name = "aipc01-fetch-docs"
version = "0.1.0"
description = "Fetch AWS documentation guides as markdown via sitemap and .md pages"
requires-python = ">=3.12"
dependencies = ["aipc01-core"]
[project.scripts]
aipc01-fetch-docs = "aipc01_fetch_docs.cli:main"
aipc01-docs-catalog = "aipc01_fetch_docs.catalog:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_docs"]
