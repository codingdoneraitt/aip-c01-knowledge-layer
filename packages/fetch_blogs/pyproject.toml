[project]
name = "aipc01-fetch-blogs"
version = "0.1.0"
description = "Fetch AWS blog posts from RSS feeds"
requires-python = ">=3.12"
dependencies = ["aipc01-core"]
[project.scripts]
aipc01-fetch-blogs = "aipc01_fetch_blogs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_blogs"]
