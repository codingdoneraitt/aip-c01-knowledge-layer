[project]
name = "aipc01-fetch-samples"
version = "0.1.0"
description = "Fetch READMEs and docs from official AWS GitHub sample repos"
requires-python = ">=3.12"
dependencies = ["aipc01-core"]
[project.scripts]
aipc01-fetch-samples = "aipc01_fetch_samples.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_samples"]
