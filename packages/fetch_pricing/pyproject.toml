[project]
name = "aipc01-fetch-pricing"
version = "0.1.0"
description = "Fetch AWS pricing from the public Price List bulk API"
requires-python = ">=3.12"
dependencies = ["aipc01-core"]
[project.scripts]
aipc01-fetch-pricing = "aipc01_fetch_pricing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipc01_fetch_pricing"]
